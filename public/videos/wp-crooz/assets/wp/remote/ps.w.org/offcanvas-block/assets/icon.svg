<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="OffCanvas / Drawer plugin icon: a slide-in drawer panel with a menu emerging from the left edge of a browser window">
  <title>OffCanvas / Drawer — slide-in panel &amp; menu</title>
  <defs>
    <linearGradient id="ocbTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#146ef5"/>
      <stop offset="1" stop-color="#6155f5"/>
    </linearGradient>
    <linearGradient id="ocbAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <linearGradient id="ocbPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5ff"/>
    </linearGradient>
    <radialGradient id="ocbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ocbClip"><rect x="0" y="0" width="256" height="256" rx="56"/></clipPath>
    <clipPath id="ocbWin"><rect x="48" y="54" width="160" height="148" rx="16"/></clipPath>
    <filter id="ocbShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a1f52" flood-opacity="0.28"/>
    </filter>
    <filter id="ocbPanelSh" x="-40%" y="-20%" width="180%" height="140%">
      <feDropShadow dx="6" dy="0" stdDeviation="7" flood-color="#0a1f52" flood-opacity="0.30"/>
    </filter>
  </defs>

  <style>
    :root { --ocb: 3.6s; }
    .ocb-glow { transform-box: fill-box; transform-origin: center; animation: ocb-glow var(--ocb) ease-in-out infinite; }
    .ocb-back { animation: ocb-back var(--ocb) ease-in-out infinite; }
    .ocb-drawer { transform-box: fill-box; transform-origin: left center; animation: ocb-drawer var(--ocb) cubic-bezier(.5,0,.2,1) infinite; }
    .ocb-r1 { animation: ocb-row var(--ocb) ease-out infinite; }
    .ocb-r2 { animation: ocb-row var(--ocb) ease-out infinite; }
    .ocb-r3 { animation: ocb-row var(--ocb) ease-out infinite; }
    .ocb-r1 { --s: 0.02; } .ocb-r2 { --s: 0.05; } .ocb-r3 { --s: 0.08; }
    @keyframes ocb-glow { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:.6; transform:scale(1.08); } }
    @keyframes ocb-drawer {
      0% { transform: translateX(-118px); }
      16% { transform: translateX(0); }
      54% { transform: translateX(0); }
      70% { transform: translateX(-118px); }
      100% { transform: translateX(-118px); }
    }
    @keyframes ocb-back {
      0% { opacity:0; }
      16% { opacity:1; }
      54% { opacity:1; }
      70% { opacity:0; }
      100% { opacity:0; }
    }
    @keyframes ocb-row {
      0%,14% { opacity:0; transform: translateX(-10px); }
      26% { opacity:1; transform: translateX(0); }
      54% { opacity:1; transform: translateX(0); }
      66% { opacity:0; transform: translateX(-10px); }
      100% { opacity:0; transform: translateX(-10px); }
    }
    .ocb-r2 { animation-name: ocb-row2; } .ocb-r3 { animation-name: ocb-row3; }
    @keyframes ocb-row2 {
      0%,18% { opacity:0; transform: translateX(-10px); }
      30% { opacity:1; transform: translateX(0); }
      54% { opacity:1; transform: translateX(0); }
      66% { opacity:0; transform: translateX(-10px); }
      100% { opacity:0; transform: translateX(-10px); }
    }
    @keyframes ocb-row3 {
      0%,22% { opacity:0; transform: translateX(-10px); }
      34% { opacity:1; transform: translateX(0); }
      54% { opacity:1; transform: translateX(0); }
      66% { opacity:0; transform: translateX(-10px); }
      100% { opacity:0; transform: translateX(-10px); }
    }
    .ocb-r1,.ocb-r2,.ocb-r3 { transform-box: fill-box; }
    @media (prefers-reduced-motion: reduce) {
      .ocb-glow,.ocb-back,.ocb-drawer,.ocb-r1,.ocb-r2,.ocb-r3 { animation: none; }
      .ocb-drawer { transform: translateX(0); }
      .ocb-back { opacity: 1; }
      .ocb-r1,.ocb-r2,.ocb-r3 { opacity: 1; transform: translateX(0); }
      .ocb-glow { opacity:.5; }
    }
  </style>

  <g clip-path="url(#ocbClip)">
    <rect x="0" y="0" width="256" height="256" fill="url(#ocbTile)"/>
    <circle cx="70" cy="60" r="120" fill="url(#ocbGlow)" opacity="0.09"/>
    <circle class="ocb-glow" cx="128" cy="132" r="94" fill="url(#ocbGlow)"/>

    <!-- Browser window -->
    <g filter="url(#ocbShadow)">
      <rect x="48" y="54" width="160" height="148" rx="16" fill="#ffffff"/>
      <path d="M48 70 a16 16 0 0 1 16-16 h128 a16 16 0 0 1 16 16 v10 H48 Z" fill="#eef1f8"/>
      <circle cx="64" cy="67" r="3.4" fill="#ff5f57"/>
      <circle cx="76" cy="67" r="3.4" fill="#febc2e"/>
      <circle cx="88" cy="67" r="3.4" fill="#28c840"/>
      <rect x="104" y="61" width="96" height="12" rx="6" fill="#ffffff"/>
      <rect x="110" y="65.5" width="52" height="3.5" rx="1.75" fill="#c9d2e8"/>
    </g>

    <!-- Window interior (clipped) -->
    <g clip-path="url(#ocbWin)">
      <!-- underlying page content -->
      <rect x="64" y="94" width="128" height="10" rx="5" fill="#e2e8f7"/>
      <rect x="64" y="114" width="96" height="7" rx="3.5" fill="#e8edf9"/>
      <rect x="64" y="128" width="112" height="7" rx="3.5" fill="#e8edf9"/>
      <rect x="64" y="142" width="80" height="7" rx="3.5" fill="#e8edf9"/>
      <rect x="64" y="168" width="60" height="20" rx="10" fill="#eef1f8"/>

      <!-- dim backdrop -->
      <rect class="ocb-back" x="48" y="80" width="160" height="122" fill="#0a1030" opacity="0.42"/>

      <!-- slide-in drawer panel -->
      <g class="ocb-drawer">
        <g filter="url(#ocbPanelSh)">
          <rect x="48" y="80" width="104" height="122" fill="url(#ocbPanel)"/>
        </g>
        <!-- drawer header: title + close X -->
        <rect x="62" y="94" width="34" height="9" rx="4.5" fill="url(#ocbAccent)"/>
        <path d="M130 94 l12 12 M142 94 l-12 12" stroke="#9aa6c7" stroke-width="2.4" stroke-linecap="round"/>
        <!-- menu rows: bullet + label -->
        <g class="ocb-r1">
          <circle cx="66" cy="122" r="4" fill="url(#ocbAccent)"/>
          <rect x="76" y="118" width="60" height="8" rx="4" fill="#c7d0e8"/>
        </g>
        <g class="ocb-r2">
          <circle cx="66" cy="144" r="4" fill="url(#ocbAccent)"/>
          <rect x="76" y="140" width="70" height="8" rx="4" fill="#c7d0e8"/>
        </g>
        <g class="ocb-r3">
          <circle cx="66" cy="166" r="4" fill="url(#ocbAccent)"/>
          <rect x="76" y="162" width="52" height="8" rx="4" fill="#c7d0e8"/>
        </g>
        <!-- CTA button in drawer -->
        <rect x="62" y="182" width="80" height="12" rx="6" fill="url(#ocbAccent)"/>
      </g>
    </g>
  </g>
</svg>
