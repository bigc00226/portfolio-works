<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>番狂わせ大富豪 ― 大富豪（大貧民）vs 3 CPU</title>
  <meta name="description" content="個性の違う 3 人の CPU と遊ぶ大富豪（大貧民）。革命・8切り・11バック・しばり・スペ3返し・都落ちなどのローカルルールを切り替えて、何試合かの合計点で順位を競います。">
  <meta name="theme-color" content="#123d31">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/games/kit.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="table" aria-label="大富豪の卓"></canvas>

    <div class="bar" id="bar" hidden>
      <button type="button" class="gk-btn sm ghost" id="bSort" title="並べ替え（S）">並べ替え</button>
      <button type="button" class="gk-btn sm ghost" id="bHint" title="ヒント（H）">ヒント</button>
      <span class="bar-info" id="barInfo" aria-live="polite"></span>
      <button type="button" class="gk-btn" id="bPass" title="パス（P）">パス</button>
      <button type="button" class="gk-btn primary" id="bPlay" title="出す（Enter）">出す</button>
    </div>

    <section id="title" class="screen" aria-labelledby="titleName">
      <div class="kv" aria-hidden="true"><img src="img/key-visual.webp" alt=""></div>
      <div class="title-inner">
        <header class="logo">
          <p class="kicker">大富豪（大貧民）・ 3 人の CPU と対戦</p>
          <h1 id="titleName"><span class="sm">番狂わせ</span>大富豪</h1>
          <p class="sub">革命でひっくり返せ。いちばん先に上がって、今夜の大富豪に。</p>
        </header>
        <div class="panel">
          <div class="chars" id="chars"></div>
          <div class="opts">
            <div class="opt"><h2>強さ</h2><div class="seg" id="segLevel" role="radiogroup" aria-label="強さ"></div></div>
            <div class="opt"><h2>試合数</h2><div class="seg" id="segGames" role="radiogroup" aria-label="試合数"></div></div>
          </div>
          <div class="actions">
            <button type="button" class="gk-btn" id="btnRules">ルール設定</button>
            <button type="button" class="gk-btn primary lg" id="btnStart">ゲームをはじめる</button>
          </div>
          <p class="rec" id="recLine"></p>
        </div>
      </div>
    </section>

    <div class="ov" id="resOv" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rTitle">
        <p class="ov-kicker" id="rKicker">第 1 試合の結果</p>
        <h2 id="rTitle">あなたは大富豪！</h2>
        <ol class="ranks" id="rRanks"></ol>
        <p class="res-note" id="rNote"></p>
        <div class="res-actions"><button type="button" class="gk-btn primary lg" id="btnNext">次の試合へ</button></div>
      </div>
    </div>

    <div class="ov" id="finOv" hidden>
      <div class="sheet final" role="dialog" aria-modal="true" aria-labelledby="fTitle">
        <p class="ov-kicker" id="fKicker">最終結果</p>
        <h2 id="fTitle">優勝！</h2>
        <ol class="ranks" id="fRanks"></ol>
        <p class="res-note" id="fNote"></p>
        <div class="res-actions">
          <button type="button" class="gk-btn" id="btnToTitle">タイトルへ</button>
          <button type="button" class="gk-btn primary lg" id="btnAgain">もう一度</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../../shared/games/kit.js"></script>
  <script src="rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
