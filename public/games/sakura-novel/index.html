<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>花明かりの写真館 ― 坂の町の、春のノベルゲーム</title>
  <meta name="description" content="坂の上の小さな写真館で見つかった、五十年前の一枚の写真。その謎を追う春休みの物語。選択肢で変わる 4 つの結末、オート・既読スキップ・バックログ・セーブ / ロード・ギャラリーを備えたノベルゲーム。">
  <meta name="theme-color" content="#1a1216">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/games/kit.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="frame" class="mode-title">
      <div id="topbar"><span id="chapName"></span></div>
      <div id="screen">
        <div id="scene">
          <div id="bg"></div>
          <div id="chars"></div>
          <div id="tint" data-kind="none"></div>
          <div id="cg"></div>
        </div>
        <div id="vignette"></div>
        <div id="chapter" hidden></div>
        <div id="badge"></div>
        <div id="fx"></div>
      </div>
      <div id="title" hidden>
        <img class="tbg" alt="" draggable="false">
        <div class="tshade"></div>
        <div class="tlogo">
          <h1>花明かりの写真館</h1>
          <p class="tsub">ある坂の町の、春の物語</p>
        </div>
        <p class="ten">HANA-AKARI PHOTO STUDIO</p>
        <nav class="tmenu" aria-label="タイトルメニュー">
          <button type="button" data-t="start" id="tStart">はじめから</button>
          <button type="button" data-t="cont" id="tCont">つづきから</button>
          <button type="button" data-t="load">ロード</button>
          <button type="button" data-t="chap" id="tChap">シーン選択</button>
          <button type="button" data-t="gallery">ギャラリー</button>
          <button type="button" data-t="config">設定</button>
        </nav>
        <p class="tinfo"></p>
      </div>
      <canvas id="petals" aria-hidden="true"></canvas>
      <div id="msg">
        <div id="nameplate"></div>
        <div id="text" aria-live="polite"></div>
        <nav id="quick" aria-label="クイックメニュー">
          <button type="button" data-act="auto"><svg viewBox="0 0 24 24"><path d="M8 6l10 6-10 6z" fill="currentColor"/></svg><span>オート</span></button>
          <button type="button" data-act="skip"><svg viewBox="0 0 24 24"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z" fill="currentColor"/></svg><span>スキップ</span></button>
          <button type="button" data-act="log"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>ログ</span></button>
          <button type="button" data-act="qsave"><svg viewBox="0 0 24 24"><path d="M12 4v10m-4-4l4 4 4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Qセーブ</span></button>
          <button type="button" data-act="qload"><svg viewBox="0 0 24 24"><path d="M12 15V5m-4 4l4-4 4 4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Qロード</span></button>
          <button type="button" data-act="save"><svg viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6zM9 4v5h6V4M9 14h6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg><span>セーブ</span></button>
          <button type="button" data-act="load"><svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg><span>ロード</span></button>
          <button type="button" data-act="config"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>設定</span></button>
        </nav>
      </div>
      <div id="choices" hidden></div>
      <div id="ending" hidden></div>
      <div id="viewer" hidden></div>
      <div id="loading">読み込み中…</div>
    </div>
  </div>
  <script src="../../shared/games/kit.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="game.js"></script>
</body>
</html>
